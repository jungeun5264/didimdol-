<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 디딤돌</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

  <main class="auth" data-mode="login">
    <!-- 왼쪽: 브랜드 영역 -->
    <section class="auth__brand">
      <a href="index.html" class="auth__logo">디딤돌</a>
      <div class="auth__copy">
        <h2 class="auth__headline">AI와 더 잘 협업하는 힘,<br>디딤돌에서 시작하세요.</h2>
        <p class="auth__desc">진단부터 실전 훈련까지 나의 성장 기록을 안전하게 관리합니다.</p>
      </div>
    </section>

    <!-- 오른쪽: 폼 영역 -->
    <section class="auth__panel">
      <div class="auth__box">
        <h1 class="auth__title" id="authTitle">다시 만나서 반가워요!</h1>
        <p class="auth__sub">나의 AI 역량 성장 기록을 안전하게 관리하세요.</p>

        <div class="auth-tabs" role="tablist" aria-label="로그인 / 회원가입">
          <button type="button" class="auth-tabs__btn" role="tab" id="tab-login" data-tab="login" aria-controls="authForm" aria-selected="true">로그인</button>
          <button type="button" class="auth-tabs__btn" role="tab" id="tab-signup" data-tab="signup" aria-controls="authForm" aria-selected="false" tabindex="-1">회원가입</button>
        </div>

        <form class="auth-form" id="authForm" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="field" data-only="signup">
            <label for="nickname">이름 또는 닉네임</label>
            <input type="text" id="nickname" name="nickname" autocomplete="nickname">
          </div>
          <div class="field">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" aria-label="비밀번호 보기" aria-pressed="false" aria-controls="password">
                <svg class="pw-toggle__show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-toggle__hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
          </div>
          <div class="field" data-only="signup">
            <label for="passwordConfirm">비밀번호 확인</label>
            <div class="pw-wrap">
              <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password">
              <button type="button" class="pw-toggle" aria-label="비밀번호 보기" aria-pressed="false" aria-controls="passwordConfirm">
                <svg class="pw-toggle__show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-toggle__hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
          </div>

          <p class="auth-form__msg" id="formMsg" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-submit">
            <span class="btn-submit__label" id="submitLabel">로그인</span>
            <svg width="53" height="14" viewBox="0 0 53 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M0 7h52M45.5 0.5L52 7l-6.5 6.5"/>
            </svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
  (function () {
    var root = document.querySelector('.auth');
    var form = document.getElementById('authForm');
    var title = document.getElementById('authTitle');
    var label = document.getElementById('submitLabel');
    var msg = document.getElementById('formMsg');
    var tabs = document.querySelectorAll('.auth-tabs__btn');
    var signupOnly = form.querySelectorAll('[data-only="signup"]');
    var pw = document.getElementById('password');

    var TEXT = {
      login:  { title: '다시 만나서 반가워요!', button: '로그인', doc: '로그인 | 디딤돌' },
      signup: { title: '디딤돌 시작하기',       button: '회원가입', doc: '회원가입 | 디딤돌' }
    };

    function setMode(mode, focusTab) {
      root.dataset.mode = mode;
      title.textContent = TEXT[mode].title;
      label.textContent = TEXT[mode].button;
      document.title = TEXT[mode].doc;
      msg.textContent = '';
      msg.classList.remove('is-ok');
      tabs.forEach(function (t) {
        var on = t.dataset.tab === mode;
        t.setAttribute('aria-selected', on);
        t.tabIndex = on ? 0 : -1;
        if (on) { form.setAttribute('aria-labelledby', t.id); if (focusTab) t.focus(); }
      });
      signupOnly.forEach(function (f) {
        var input = f.querySelector('input');
        f.hidden = mode !== 'signup';
        input.required = mode === 'signup';
        input.classList.remove('is-error');
      });
      hidePasswords();
      pw.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
      form.querySelectorAll('.is-error').forEach(function (el) { el.classList.remove('is-error'); });
      history.replaceState(null, '', mode === 'signup' ? '#signup' : location.pathname + location.search);
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () { setMode(t.dataset.tab); });
      t.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          setMode(t.dataset.tab === 'login' ? 'signup' : 'login', true);
        }
      });
    });

    form.addEventListener('input', function (e) {
      e.target.classList.remove('is-error');
      msg.textContent = '';
      msg.classList.remove('is-ok');
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.classList.remove('is-ok');
      var mode = root.dataset.mode;
      var empty = Array.prototype.filter.call(form.querySelectorAll('input'), function (i) {
        return i.required && !i.value.trim();
      });
      if (empty.length) {
        empty.forEach(function (i) { i.classList.add('is-error'); });
        msg.textContent = empty[0].labels[0].textContent + '을(를) 입력해 주세요.';
        empty[0].focus();
        return;
      }
      if (mode === 'signup') {
        var confirm = document.getElementById('passwordConfirm');
        if (confirm.value !== pw.value) {
          confirm.classList.add('is-error');
          msg.textContent = '비밀번호가 일치하지 않아요.';
          confirm.focus();
          return;
        }
        /* 프로토타입: 가입 완료 → 로그인 탭으로 전환, 아이디 유지 */
        var id = document.getElementById('userId').value;
        form.reset();
        setMode('login');
        document.getElementById('userId').value = id;
        msg.textContent = '가입이 완료됐어요. 로그인해 주세요.';
        msg.classList.add('is-ok');
        pw.focus();
        return;
      }
      /* 프로토타입: 로그인 성공 → 사전진단 페이지로 이동 */
      location.href = 'diagnosis.html';
    });

    /* 비밀번호 보기/숨기기 */
    var toggles = form.querySelectorAll('.pw-toggle');
    function hidePasswords() {
      toggles.forEach(function (b) {
        document.getElementById(b.getAttribute('aria-controls')).type = 'password';
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-label', '비밀번호 보기');
      });
    }
    toggles.forEach(function (b) {
      b.addEventListener('click', function () {
        var input = document.getElementById(b.getAttribute('aria-controls'));
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.setAttribute('aria-pressed', show);
        b.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
        /* 커서를 입력 끝에 유지 */
        input.focus();
        var len = input.value.length; input.setSelectionRange(len, len);
      });
    });

    setMode(location.hash === '#signup' ? 'signup' : 'login');
  })();
  </script>
</body>
</html>
